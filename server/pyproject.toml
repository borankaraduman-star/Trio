[project]
name = "trio-server"
version = "0.2.0"
description = "Backend of Trio, a small self-hosted chat and voice server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # FileResponse answers Range requests (attachments) from 0.40 on.
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    # Streaming multipart parser for POST /api/uploads.
    "python-multipart>=0.0.18",
    # Cloudflare TURN credentials for /api/ice.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "anyio>=4",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trio_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient prefers a package the brief did not ask for.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S324"]
