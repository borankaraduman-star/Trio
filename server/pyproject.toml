[project]
name = "trio-server"
version = "0.9.0"
description = "Backend of Trio, a small self-hosted chat and voice server"
requires-python = ">=3.12"
# SPDX expression (PEP 639); the text is LICENSE at the repository root.
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    # FileResponse answers Range requests (attachments) from 0.40 on.
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    # Streaming multipart parser for POST /api/uploads.
    "python-multipart>=0.0.18",
    # Cloudflare TURN credentials for /api/ice.
    "httpx>=0.27",
    # Web Push (CONTRACT-V6-PUSH): P-256 ECDH/ECDSA, HKDF and AES-128-GCM for
    # RFC 8291 payload encryption and RFC 8292 VAPID, implemented in push_crypto.
    "cryptography>=43",
    # Quiet hours are kept in the user's IANA time zone; the slim image may
    # ship without /usr/share/zoneinfo, and zoneinfo falls back to this.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "anyio>=4",
    "ruff>=0.6",
]

[build-system]
# 77+: the PEP 639 `license = "MIT"` expression above.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trio_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient prefers a package the brief did not ask for.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S324"]
