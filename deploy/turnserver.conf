# coturn — the STATIC half of the configuration.
#
# coturn's config file does not expand environment variables, so everything
# that depends on deploy/.env (shared secret, realm, public IP) is passed as
# command-line flags in docker-compose.yml:
#   --static-auth-secret   --realm   --external-ip
# Flags and this file are merged; nothing here needs editing for a normal
# install.

# Plain TURN/STUN on 3478, UDP and TCP.
listening-port=3478

# No TLS/DTLS listeners by default (no certificate is provisioned for coturn).
# WebRTC media is encrypted end to end between the browsers by DTLS-SRTP
# whether or not the TURN hop is TLS; TURN-over-TLS only helps on networks
# that block everything but 443/TLS. To enable it, see README ("TURN üzerinden
# TLS"): remove these two lines and add tls-listening-port=5349, cert=, pkey=.
no-tls
no-dtls

# Relay ports. Every TURN allocation takes one port, and a browser makes a
# few allocations per peer connection (UDP and TCP transport), so 3 people in
# a mesh use roughly 12-20. 41 ports is enough for that; widen the range (and
# the firewall rule) if more people join. MUST match the UDP range opened in
# the firewall.
min-port=49160
max-port=49200

# Time-limited credentials derived from the shared secret (TURN REST API
# scheme) — the scheme the server's /api/ice uses.
use-auth-secret
fingerprint

# Hardening.
no-cli
no-multicast-peers
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
# Never relay INTO private, loopback or link-local networks: without this an
# authenticated user could use the relay to reach services on the VPS itself
# or on its provider's internal network.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

stale-nonce=600

log-file=stdout
no-software-attribute
