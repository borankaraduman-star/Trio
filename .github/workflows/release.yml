# Builds the Trio desktop installers (Windows .exe, macOS .dmg x64 + arm64,
# Linux .AppImage) and publishes them as a GitHub release, with
# SHA256SUMS.txt and signing.json beside them (CONTRACT-V6-DOWNLOAD: the
# download page /indir reads both).
#
# CONTRACT-V10-UPDATE: the release also carries what the apps' updater reads:
# latest.yml (+ the .exe.blockmap), latest-linux.yml (the AppImage embeds its
# block map) and latest-mac.yml with the macOS .zip files (+ blockmaps). The
# installed apps fetch these from github.com/<repo>/releases/latest, i.e. a
# pre-release never reaches an app running a release version. Every latest*.yml
# is checked against the files beside it before anything is published.
#
# Dispatch it only when the desktop app changed (desktop/ since the last
# release): every release makes every installed Windows/Linux app download
# and install it, and every macOS app show the manual notice.
#
# Signing is optional and off until its secrets exist (docs/imzalama.md):
#
#   * macOS: CSC_LINK (base64 .p12 of a "Developer ID Application"
#     certificate), CSC_KEY_PASSWORD, APPLE_API_KEY (the .p8 text),
#     APPLE_API_KEY_ID, APPLE_API_ISSUER -> Developer ID signing +
#     notarization. Without all five: ad-hoc signing (`mac.identity: "-"`),
#     as before.
#   * Windows: WIN_CSC_LINK (base64 .pfx) + WIN_CSC_KEY_PASSWORD, OR Azure
#     Artifact Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#     AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE,
#     AZURE_SIGNING_PUBLISHER. Without either: unsigned, as before.
#
# signing.json says, per system, whether the build was REALLY signed (checked
# after the build, not inferred from the secrets): a configured signing that
# did not produce a valid signature fails the job instead of publishing.
#
# Two ways to start it:
#
#   * By hand (Actions -> release -> Run workflow), with a version such as
#     0.2.0, the branch or commit to release (default main) and whether it is
#     a pre-release. Nothing has to be tagged beforehand: the release job
#     creates the tag v<version> at exactly the resolved commit.
#   * By pushing a v* tag (the old way); the commit is the tag's.
#
# The workflow DEFINITION that runs on a dispatch is the one on the branch the
# dispatch is started from ("Use workflow from"), which need not be the commit
# being released. So `prepare` resolves the commit ONCE to a full SHA and
# every later job checks out exactly that SHA; no job relies on the default
# checkout ref. If the branch moves while the builds run, nothing changes.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (semver), e.g. 0.2.0 or 0.2.0-rc.1"
        required: true
        type: string
      ref:
        description: "Branch or commit SHA to release"
        required: false
        default: main
        type: string
      prerelease:
        description: "Mark as pre-release (always on when the version has a -suffix)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Two releases of the same version never run at the same time: the second
# waits, then fails the existing-tag check in `prepare`.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      # Full history and every tag, so any branch, full or short SHA and the
      # existing tags can be looked up below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version, resolve commit
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          # Strict semver 2.0 core + optional pre-release, no leading v, no
          # leading zeros, no build metadata.
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${id}(\.${id})*)?$"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::Invalid version '${version}': expected semver without a leading v, e.g. 0.2.0 or 0.2.0-rc.1"
            exit 1
          fi
          tag="v${version}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null \
               || [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
              echo "::error::Tag ${tag} already exists; pick a new version"
              exit 1
            fi
            ref="${INPUT_REF:-main}"
            if git rev-parse -q --verify "refs/remotes/origin/${ref}^{commit}" >/dev/null; then
              sha="$(git rev-parse "refs/remotes/origin/${ref}^{commit}")"
            elif [[ "$ref" =~ ^[0-9a-fA-F]{7,40}$ ]] \
                 && sha="$(git rev-parse -q --verify "${ref}^{commit}")"; then
              :
            else
              echo "::error::Ref '${ref}' is neither a branch nor a commit SHA of this repository"
              exit 1
            fi
          else
            sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
          fi

          prerelease=false
          if [ "$INPUT_PRERELEASE" = "true" ] || [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "sha=${sha}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} from ${sha} (prerelease: ${prerelease})" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Every OS finishes even if one fails, but `release` needs all of them:
      # one failed build means no release.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: |
              desktop/release/*.exe
              desktop/release/*.exe.blockmap
              desktop/release/latest.yml
          - os: macos-latest
            target: --mac
            files: |
              desktop/release/*.dmg
              desktop/release/*.dmg.blockmap
              desktop/release/*.zip
              desktop/release/*.zip.blockmap
              desktop/release/latest-mac.yml
          - os: ubuntu-latest
            target: --linux
            files: |
              desktop/release/*.AppImage
              desktop/release/latest-linux.yml
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      # No certificates unless the signing step below configures them: never
      # look for one in the keychain / store.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Install
        run: npm ci

      # The keymap test needs an X display; without one it is skipped
      # silently, so Linux runs the tests under a virtual display.
      - name: Test (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          xvfb-run -a npm test

      - name: Test
        if: runner.os != 'Linux'
        run: npm test

      # macOS: Developer ID + notarization, only when ALL five secrets exist.
      # The secrets reach only this step; it hands electron-builder what it
      # needs through GITHUB_ENV (masked in logs) and a key file in RUNNER_TEMP.
      - name: Signing setup (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ] || [ -z "$APPLE_API_KEY" ] \
             || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            if [ -n "$CSC_LINK$APPLE_API_KEY" ]; then
              echo "::warning::macOS signing secrets are incomplete; building ad-hoc signed (see docs/imzalama.md)"
            fi
            echo "SIGN_MAC=false" >> "$GITHUB_ENV"
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY" > "$key"
          {
            echo "SIGN_MAC=true"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
            echo "CSC_LINK=$CSC_LINK"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD"
            echo "APPLE_API_KEY=$key"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
          # Drop the ad-hoc identity so the Developer ID one is used, and notarize.
          # CONTRACT-V10-UPDATE: the built app is told it is signed
          # (trioBuild.macSigned in its package.json), which turns its
          # self-update on; the signature check below fails the job when the
          # app is not really signed, so the flag cannot ship on an unsigned build.
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete pkg.build.mac.identity;
            pkg.build.mac.notarize = true;
            pkg.build.extraMetadata = { ...(pkg.build.extraMetadata || {}), trioBuild: { macSigned: true } };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      # Windows: a .pfx (WIN_CSC_LINK), else Azure Artifact Signing, else unsigned.
      - name: Signing setup (Windows)
        if: runner.os == 'Windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
        run: |
          set -euo pipefail
          if [ -n "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
            {
              echo "SIGN_WINDOWS=true"
              echo "WIN_CSC_LINK=$WIN_CSC_LINK"
              echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          elif [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] \
               && [ -n "$AZURE_SIGNING_ENDPOINT" ] && [ -n "$AZURE_SIGNING_ACCOUNT" ] \
               && [ -n "$AZURE_SIGNING_PROFILE" ] && [ -n "$AZURE_SIGNING_PUBLISHER" ]; then
            {
              echo "SIGN_WINDOWS=true"
              echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"
              echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"
              echo "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET"
            } >> "$GITHUB_ENV"
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              pkg.build.win.azureSignOptions = {
                endpoint: process.env.AZURE_SIGNING_ENDPOINT,
                codeSigningAccountName: process.env.AZURE_SIGNING_ACCOUNT,
                certificateProfileName: process.env.AZURE_SIGNING_PROFILE,
                publisherName: process.env.AZURE_SIGNING_PUBLISHER,
              };
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            '
          else
            if [ -n "$WIN_CSC_LINK$AZURE_CLIENT_ID" ]; then
              echo "::warning::Windows signing secrets are incomplete; building unsigned (see docs/imzalama.md)"
            fi
            echo "SIGN_WINDOWS=false" >> "$GITHUB_ENV"
          fi

      - name: Build installers
        run: npm run build && npx electron-builder ${{ matrix.target }} --publish never

      # What the download page is told: true only for a signature that checks
      # out on the built file. Configured signing that does not check out
      # fails here rather than shipping a build the page would call signed.
      - name: Check signature (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          signed=true
          for app in release/mac*/Trio.app; do
            verdict="$(spctl --assess --type execute -vv "$app" 2>&1 || true)"
            echo "$app: $verdict"
            if ! grep -q "source=Notarized Developer ID" <<<"$verdict"; then
              signed=false
            fi
          done
          if [ "${SIGN_MAC:-false}" = "true" ] && [ "$signed" != "true" ]; then
            echo "::error::macOS signing was configured but the app is not accepted as notarized Developer ID"
            exit 1
          fi
          [ "${SIGN_MAC:-false}" = "true" ] || signed=false
          echo "{\"mac\": ${signed}}" > release/signing-mac.json

      - name: Check signature (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = $true
          foreach ($exe in Get-ChildItem release/*.exe) {
            $status = (Get-AuthenticodeSignature $exe.FullName).Status
            Write-Host "$($exe.Name): $status"
            if ($status -ne 'Valid') { $signed = $false }
          }
          if ($env:SIGN_WINDOWS -eq 'true' -and -not $signed) {
            Write-Host "::error::Windows signing was configured but the installer has no valid signature"
            exit 1
          }
          if ($env:SIGN_WINDOWS -ne 'true') { $signed = $false }
          $value = if ($signed) { 'true' } else { 'false' }
          Set-Content -Path release/signing-windows.json -Value "{`"windows`": $value}" -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: trio-desktop-${{ matrix.os }}
          path: |
            ${{ matrix.files }}
            desktop/release/signing-*.json
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: trio-desktop-*
          merge-multiple: true

      - name: List installers
        run: ls -l installers

      # CONTRACT-V6-DOWNLOAD: the page shows each file's SHA-256 and hides the
      # warning help for a platform that is signed.
      - name: Checksums and signing.json
        working-directory: installers
        run: |
          set -euo pipefail
          sha256sum -- *.exe *.dmg *.zip *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt
          shopt -s nullglob
          parts=(signing-*.json)
          if [ ${#parts[@]} -gt 0 ]; then
            jq -s 'add | {windows: (.windows == true), mac: (.mac == true)}' "${parts[@]}" > signing.json
          else
            echo '{"windows": false, "mac": false}' > signing.json
          fi
          cat signing.json
          echo "SIGNED_WINDOWS=$(jq -r .windows signing.json)" >> "$GITHUB_ENV"
          echo "SIGNED_MAC=$(jq -r .mac signing.json)" >> "$GITHUB_ENV"

      # CONTRACT-V10-UPDATE: the apps install what latest*.yml names after
      # checking its sha512. Refuse to publish metadata that names a file that
      # is not here, a path instead of a plain name, or a hash that does not
      # match the file (which every app would then refuse anyway).
      - name: Check update metadata
        working-directory: installers
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, re, sys
          version = os.environ["VERSION"]
          expected = {"latest.yml": 1, "latest-mac.yml": 2, "latest-linux.yml": 1}
          ok = True
          for name, minimum in expected.items():
              if not os.path.exists(name):
                  print(f"::error::{name} missing"); ok = False; continue
              text = open(name, encoding="utf-8").read()
              if not re.search(rf"^version: '?{re.escape(version)}'?$", text, re.M):
                  print(f"::error::{name}: version is not {version}"); ok = False
              entries = re.findall(r"^  - url: (\S+)\n    sha512: (\S+)$", text, re.M)
              if len(entries) < minimum:
                  print(f"::error::{name}: expected at least {minimum} files, found {len(entries)}"); ok = False
              for url, sha in entries:
                  if not re.fullmatch(r"Trio-[0-9A-Za-z._-]+\.(exe|zip|dmg|AppImage)", url) or not os.path.isfile(url):
                      print(f"::error::{name}: {url} is not a file of this release"); ok = False; continue
                  digest = hashlib.sha512()
                  with open(url, "rb") as f:
                      for chunk in iter(lambda: f.read(1 << 20), b""):
                          digest.update(chunk)
                  if base64.b64encode(digest.digest()).decode() != sha:
                      print(f"::error::{name}: sha512 of {url} does not match"); ok = False
                  else:
                      print(f"{name}: {url} ok")
          sys.exit(0 if ok else 1)
          PY

      # The install note, true for what was actually signed.
      - name: Release notes
        run: |
          set -euo pipefail
          {
            echo "## Kurulum notu"
            echo
            if [ "$SIGNED_WINDOWS" = "true" ]; then
              echo "- **Windows:** kurulum dosyası imzalı. Yeni bir sürümde SmartScreen yine de \"Windows bilgisayarınızı korudu\" derse **Daha fazla bilgi** → **Yine de çalıştır**."
            else
              echo "- **Windows (SmartScreen):** kurulum dosyası imzasız; \"Windows bilgisayarınızı korudu\" penceresi çıkar, yayımcı \"Bilinmeyen yayımcı\" görünür. **Daha fazla bilgi**'ye tıkla, sonra **Yine de çalıştır**. Tarayıcı \"yaygın olarak indirilmiyor\" derse indirilenler listesinden **Sakla** seç."
            fi
            if [ "$SIGNED_MAC" = "true" ]; then
              echo "- **macOS:** \`.dmg\`'yi açıp Trio'yu **Uygulamalar**'a sürükle (Intel için \`x64\`, Apple Silicon için \`arm64\`). Uygulama imzalı ve Apple tarafından onaylı; ilk açılışta yalnız **Aç** de."
            else
              echo "- **macOS (Gatekeeper):** \`.dmg\`'yi açıp Trio'yu **Uygulamalar**'a sürükle (Intel için \`x64\`, Apple Silicon için \`arm64\`). Uygulama imzasız; \"Apple, Trio'nun kötü amaçlı yazılım içermediğini doğrulayamadı\" uyarısını **Bitti** ile kapat, **Sistem Ayarları → Gizlilik ve Güvenlik**'te \"Trio engellendi…\" satırının yanındaki **Yine de Aç**'a bas, parolanı gir, tekrar **Aç**. (macOS 14 ve öncesinde Control+tıklayıp **Aç** da yeter.)"
            fi
            echo "- **Linux:** \`.AppImage\` dosyasını çalıştırılabilir yap (\`chmod +x\`) ve aç."
            echo
            echo "Dosyaların SHA-256 değerleri \`SHA256SUMS.txt\` içinde. İlk açılışta sunucu adresi sorulur (ör. \`https://<ad>.up.railway.app\`); en kolayı sunucunun \`/indir\` sayfası."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # On a dispatch the tag must still not exist: it is created below, by
      # the release, at the resolved commit.
      - name: Check tag is still free
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} was created while the builds ran"
            exit 1
          fi

      # On a dispatch the tag does not exist yet, so GitHub creates it at
      # target_commitish (the full SHA from `prepare`). On a tag push the tag
      # exists and target_commitish is ignored.
      #
      # The tag is created with the default GITHUB_TOKEN, and events caused by
      # that token do not start new workflow runs (GitHub's rule against
      # recursive runs). So the new v* tag does NOT trigger this workflow's
      # `push: tags` path a second time. That is intended: do not switch to a
      # PAT here, or every dispatch would build and release twice.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: Trio ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installers/*.exe
            installers/*.exe.blockmap
            installers/*.dmg
            installers/*.dmg.blockmap
            installers/*.zip
            installers/*.zip.blockmap
            installers/*.AppImage
            installers/latest.yml
            installers/latest-mac.yml
            installers/latest-linux.yml
            installers/SHA256SUMS.txt
            installers/signing.json
          # With generate_release_notes the action puts this text BEFORE the
          # generated notes.
          body_path: ${{ runner.temp }}/notes.md
