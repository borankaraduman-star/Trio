# Checks every package on pushes to main/dev and on pull requests:
#   server  - ruff + pytest (Python 3.12, uv)
#   web     - typecheck/build + vitest
#   desktop - typecheck + node:test (under a virtual X display)
#   e2e     - Playwright against the real server and the built web client
#   docker  - the root Dockerfile (what Railway deploys) still builds and starts
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/pyproject.toml

      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev]'

      - name: Lint
        run: .venv/bin/ruff check

      - name: Format
        run: .venv/bin/ruff format --check

      - name: Test
        run: .venv/bin/python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Test
        run: npm test

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The keymap test compares against uiohook-napi's table and needs an X
      # display; without one it is skipped (desktop/README.md).
      - name: Test
        run: xvfb-run -a npm test

  e2e:
    needs: [server, web]
    runs-on: ubuntu-latest
    # The suite runs with one worker; split by file into shards so the whole
    # of it fits the time limit (one job hit 30 minutes at ~150 tests).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 30
    env:
      # The web client is built below; the suite's global setup need not rebuild it.
      TRIO_E2E_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/pyproject.toml

      # e2e/lib/server.ts runs server/.venv/bin/uvicorn.
      - name: Install server
        working-directory: server
        run: |
          uv venv --python 3.12
          uv pip install -e .

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: Build web client
        working-directory: web
        run: npm ci && npm run build

      - name: Install e2e
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # `npm test` is `playwright test --trace off`; the html reporter is added
      # so a failed run leaves a report to download.
      - name: Run Playwright
        working-directory: e2e
        run: npm test -- --reporter=list,html --shard=${{ matrix.shard }}/4

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/.state/server.log
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t trio:ci .

      - name: Smoke test
        run: |
          docker run -d --name trio -p 8000:8000 -e TRIO_INVITE_CODE=ci trio:ci
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs trio
          exit 1
